<title>يا ساتر! جتنا عزيمة — غرفة العائلة</title>
<style>
:root{--ink:#3a2c43;--muted:#806d80;--plum:#543960;--peach:#ed7767;--line:#ebdfe8;--good:#248a70;--soft:#f8eef4}*{box-sizing:border-box}html{background:#fff9f2}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 100% 0%,#ffdfc9,transparent 36%),radial-gradient(ellipse at 0 90%,#efdcef,transparent 45%),#fff9f2;font:16px/1.7 Tahoma,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.62}button:focus-visible,input:focus-visible{outline:3px solid #b27bb3;outline-offset:2px}.page{width:min(740px,100%);margin:auto;padding:13px 14px 55px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 2px 20px}.brand{font-weight:900;display:flex;gap:9px;align-items:center}.symbol{display:grid;place-items:center;width:42px;height:42px;background:#52365e;border-radius:13px;color:#fff;font-size:23px}.top a{color:#684c72;text-decoration:none;border:1px solid #e7d8e2;border-radius:12px;padding:7px 10px;font-weight:700;background:#fff8}.paper{background:#fffcffec;border:1px solid #f0e3ea;box-shadow:0 18px 50px #65425c19;border-radius:26px;overflow:hidden}.head{padding:24px 26px;background:linear-gradient(120deg,#52345f,#856494);color:white}.head .eyebrow{display:inline-block;border:1px solid #fff6;background:#ffffff20;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700}.head h1{font-size:clamp(25px,5vw,37px);line-height:1.34;margin:8px 0}.head p{margin:4px 0;color:#fceefb}.body{padding:22px 25px 28px}.sub{color:var(--muted);margin:8px 0 18px}.modegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mode{padding:15px 12px;border-radius:15px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:800}.mode.active{border-color:#af86ae;background:#f6e8f2;color:#5e3f65}.field{display:block;margin:14px 0 4px;font-weight:800;font-size:14px}.input{width:100%;max-width:100%;min-height:53px;padding:12px 14px;border:1px solid #e6d9e1;background:#fff;border-radius:14px;color:var(--ink);outline:none}.input:focus{border-color:#af86ae}.btn{border:0;border-radius:14px;min-height:47px;padding:10px 17px;font-weight:900;background:#eee1ed;color:#543960}.btn.main{background:linear-gradient(120deg,#f17664,#e48c67);color:#fff;box-shadow:0 8px 18px #c17e7040}.btn:disabled{box-shadow:none}.btn.ghost{background:#faf2f8;border:1px solid #eadce7}.btn.block{width:100%;margin-top:17px}.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.btn-row>*{flex:1}.warning{border:1px solid #ffd4ca;background:#fff0e9;border-radius:13px;padding:10px 13px;margin-top:15px;color:#a04339;font-weight:bold}.muted{font-size:13px;color:var(--muted)}.codebox{padding:16px;border:1px dashed #b995b3;border-radius:17px;background:#fcf6fb;text-align:center;margin:13px 0 20px}.roomcode{font-size:clamp(30px,7vw,47px);font-family:Arial,sans-serif;letter-spacing:7px;direction:ltr;font-weight:900;color:#53385d;margin:6px 0}.badge{background:#f6eaf4;color:#674b70;border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:13px 0}.person{padding:10px 12px;border:1px solid #e8dce6;background:white;border-radius:13px;font-weight:700;overflow-wrap:anywhere}.person.on{background:#e8f7ee;border-color:#c1e5d3}.person small{display:block;color:#877589;font-size:12px}.stages{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:9px}.meter-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0 22px}.meter-card{padding:10px 9px;border:1px solid #eee2e9;border-radius:13px;background:#fff}.meter-label{font-size:11px;font-weight:800;display:flex;justify-content:space-between;gap:5px}.line{height:8px;background:#f0e6eb;border-radius:20px;margin-top:8px;overflow:hidden}.fill{display:block;height:100%;background:#cb916b}.fill.time{background:#8064aa}.fill.mood{background:#4baf97}.scene{padding:20px;border:1px solid #ebdbe6;background:linear-gradient(140deg,#fff,#fff7fa);border-radius:18px}.scene h2{margin:5px 0;font-size:clamp(22px,4vw,29px);line-height:1.4}.scene .emoji{font-size:39px}.scene p{margin:7px 0;color:#6f5f6f}.choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:right;border-radius:14px;border:1px solid #e9dce5;padding:15px 14px;background:#fff;color:var(--ink);font-weight:bold;margin-top:10px;min-height:64px}.choice.selected{border:2px solid #8c6593;background:#f5eaf4}.choice .letter{background:#f5e6f1;padding:4px 10px;color:#774f7a;border-radius:9px}.notice{margin-top:15px;padding:12px;border-radius:14px;background:#fff7e9;border:1px solid #ffe6ba;color:#795b42;font-size:14px}.vote-track{margin-top:18px}.vote-track .line{height:12px}.vote-track .fill{background:#df987a}.outcome{padding:17px;border-radius:16px;background:#fff7ec;border:1px solid #ffdfbf;margin:15px 0}.outcome strong{display:block;font-size:20px}.delta{display:inline-block;font-size:13px;font-weight:900;margin:7px 6px 0 0;padding:4px 10px;border-radius:99px;background:#f6edf3;color:#75546c}.delta.good{background:#e6f6ee;color:#22765f}.delta.bad{background:#ffeded;color:#ad4c4a}.tally{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.tally span{padding:7px 11px;border-radius:99px;background:#f3e8f0;font-weight:800}.count{font-size:58px;text-align:center;color:#784a80;font-weight:900;line-height:1.4;font-variant-numeric:tabular-nums}.ranks{display:grid;gap:9px;margin-top:14px}.rank{display:flex;justify-content:space-between;padding:11px 14px;border:1px solid #e9dce6;border-radius:12px;background:#fff;font-weight:bold}.rank:first-child{background:#fff7e5;border-color:#ffd8a3}.finale{background:linear-gradient(135deg,#54385f,#886394);border-radius:20px;padding:22px;color:#fff;text-align:center}.finale h2{font-size:30px;margin:8px 0}.finale p{color:#f6e9f9}.foot{text-align:center;font-size:12px;color:#8f8291;margin:21px 0}.loading{text-align:center;padding:48px;color:var(--muted)}@media(max-width:450px){.page{padding:7px 9px 36px}.top{margin-bottom:12px}.paper{border-radius:20px}.head{padding:22px 18px}.body{padding:19px 15px}.modegrid{gap:7px}.mode{font-size:13px}.scene{padding:16px}.meter-card{padding:7px 6px}.meter-label{font-size:10px}.person{font-size:13px}.roomcode{letter-spacing:4px}}
</style>
</head>
<body><main class="page"><header class="top"><div class="brand"><span class="symbol">🫖</span><span>يا ساتر! جتنا عزيمة</span></div><a href="solo.html">🎲 جهاز واحد</a></header><div id="app" class="loading">جاري فتح اللعبة...</div><p class="foot">غرف خاصة برمز دخول • من ٢ إلى ١٠ لاعبين • بدون تسجيل حساب</p></main>
<script>
// تحميل متسامح مع الأخطاء: بدلاً من البقاء على "جاري فتح اللعبة" إلى الأبد.
(function () {
  const app = document.getElementById('app');
  const waiting = () => app.classList.contains('loading') && app.textContent.includes('جاري فتح اللعبة');
  let resolved = false;
  const plain = value => String(value || 'سبب غير معروف').slice(0, 600);
  function showBootFailure(reason) {
    if (resolved || !waiting()) return;
    resolved = true;
    app.className = 'paper';
    app.innerHTML = `<div class="head"><span class="eyebrow">مساعدة في التشغيل</span><h1>تعذّر فتح العزيمة 😅</h1><p>الصفحة منشورة، لكن أحد ملفات التشغيل لم يُحمّل.</p></div>
      <div class="body"><p class="warning">المشكلة: <span id="detail"></span></p>
      <p>تأكدي من وجود الملفات <b>online.js</b> و<b>game_data.js</b> و<b>firebase-config.js</b> بجانب <b>index.html</b> في GitHub.</p>
      <div class="btn-row"><button id="retryBoot" class="btn main">🔄 إعادة المحاولة</button><a class="btn ghost" href="./solo.html" style="text-align:center;text-decoration:none">🎲 اللعب بجهاز واحد</a></div></div>`;
    document.getElementById('detail').textContent = plain(reason);
    document.getElementById('retryBoot').onclick = () => location.reload();
  }
  window.addEventListener('error', event => {
    if (waiting() && event.message) showBootFailure(event.message);
  });
  window.addEventListener('unhandledrejection', event => {
    if (waiting()) showBootFailure(event.reason?.message || event.reason);
  });
  // في حال تأخر الخادم أو حُجبت خدمات Firebase على متصفح الجوال.
  setTimeout(() => { if (waiting()) showBootFailure('تأخر تحميل JavaScript أو Firebase. تأكدي من اتصال الإنترنت ووجود الملفات.'); }, 15000);
  import('./online.js?v=2').catch(error => showBootFailure(error?.message || error));
})();
</script>
</body></html>
