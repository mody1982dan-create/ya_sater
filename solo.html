  function renderSetup(){

  function startGame(){const names=draftNames.map(x=>x.trim()).filter(Boolean);if(names.length<2||names.length>10){const el=$('nameError');el.textContent='اكتبوا اسم لاعبتين على الأقل (وحتى ١٠).';el.classList.add('visible');return;}

  function statMarkup(){return `<div class="stats">${statsMeta.map(([key,ic,label])=>{const v=game.stats[key];return `<div class="stat"><div class="stat-top"><span>${ic} ${label}</span><b>${v}٪</b></div><div class="meter ${key} ${v<30?'low':''}"><span style="width:${v}%"></span></div></div>`;}).join('')}</div>`;}

  function renderPlay(){const scene=currentScene(),idx=game.turn%game.players.length;
    box(hero('وقت القرارات • الكل يشارك','العزيمة دخلت الجد!','ناقشوا الموقف شوي، وصاحبة الدور تختار القرار النهائي.','🥘 🫖')+`<section class="body">${progressMarkup()}${statMarkup()}<div class="story"><div class="emoji" aria-hidden="true">${scene.emoji}</div><p class="section-label">${acts[Math.floor(game.turn/2)].intro}</p><h2>${scene.title}</h2><p>${scene.desc}</p></div><div class="player-callout">🎤 الدور على ${escapeHtml(game.players[idx].name)} — وش القرار؟</div><div class="choices">${scene.options.map((o,i)=>`<button class="choice" data-choice="${i}"><span>${escapeHtml(o.t)}</span><em>${['أ','ب','ج'][i]}</em></button>`).join('')}</div><p class="fine">كل خيار له أثر مختلف... اختاري قبل ما تعرفين وش بيصير! 🤫</p>${playersMarkup()}</section>`);

  function choose(index){if(game.mode!=='play')return;const option=currentScene().options[index];if(!option)return;const pi=game.turn%game.players.length;const before={...game.stats};let n=0;for(const [i,k] of ['budget','time','mood'].entries()){game.stats[k]=Math.max(0,Math.min(100,game.stats[k]+option.d[i]));n+=game.stats[k]-before[k];}

  }
  function finishChallenge(ok){if(game.mode!=='challenge')return;clearTicker();const idx=challengePersonIndex();const before=game.stats.mood,change=ok?7:-3;game.stats.mood=Math.min(100,Math.max(0,before+change));if(ok)game.players[idx].score+=6;game.challengeResult={ok,name:game.players[idx].name,d:game.stats.mood-before,points:ok?6:0};game.mode='challengeOutcome';persist();if(ok){beep('win');burst();}else beep('bad');render();}
  function renderChallengeOutcome(){const r=game.challengeResult;box(hero('نتيجة تحدّي اللمّة',r.ok?'يا سلام عليكم!':'يا ساتر، راحت علينا!','مهما كانت النتيجة، العزيمة للحين مستمرة.','🎉 😅')+`<section class="body">${statMarkup()}<div class="story"><div class="result-icon">${r.ok?'🏅':'🤭'}</div><h2>${r.ok?'كفو يا '+escapeHtml(r.name)+'!':'عوافي يا '+escapeHtml(r.name)+'!'}</h2><p>${r.ok?'أبدعتي في التحدي ورفعتِ معنويات العزيمة.':'المحاولة لحالها سالفة، يلا نلحق باقي العزيمة!'}</p><div class="delta-list">${deltaText('mood',r.d)}</div><div class="points">⭐ نقاط التحدي: ${r.points}</div></div><div class="buttons"><button class="primary" id="continueAfterChallenge">نكمل السالفة ←</button></div></section>`);$('continueAfterChallenge').onclick=()=>{game.mode='play';persist();render();};}
  function rank(){return [...game.players].sort((a,b)=>b.score-a.score);}
  function conclusion(){const s=game.stats;const score=Math.round(s.budget*.22+s.time*.22+s.mood*.56);
    if(score>=84)return {title:'عزيمة أسطورية!',emoji:'🏆',text:'الضيوف يسألون عن موعد العزيمة الجاية، وصارت السالفة حديث اللمّة!'};
    if(score>=65)return {title:'عزيمة تفتح النفس!',emoji:'✨',text:'طلعت العزيمة ناجحة رغم المفاجآت. واضح إن عندكم حلول لكل ورطة!'};
    if(score>=45)return {title:'عدّت على خير!',emoji:'😅',text:'صار فيها لخبطة، بس أهم شيء الضحكة والجمعة الحلوة.'};
    return {title:'يا ساتر! وش هالعزيمة؟',emoji:'🙈',text:'يمكن العشاء تعثر... بس كمية السوالف اللي طلعت تستاهل إعادة التجربة!'};
  }
  function resultsText(){const c=conclusion();const winners=rank();return `يا ساتر! جتنا عزيمة 🫖\n${c.emoji} ${c.title}\n💰 الميزانية: ${game.stats.budget}٪\n⏳ الوقت: ${game.stats.time}٪\n💗 الوناسة: ${game.stats.mood}٪\n\nنقاط اللاعبات:\n${winners.map((p,i)=>`${i+1}. ${p.name}: ${p.score} نقطة`).join('\n')}\n\n#يا_ساتر_جتنا_عزيمة`;}
  function renderFinal(){const c=conclusion(),sorted=rank(),best=sorted[0].score,champions=sorted.filter(p=>p.score===best).map(p=>p.name).join(' و ');
    box(hero('خلصت عزيمتنا','والحمد لله على السلامة!','كل قرار غيّر القصة، وكل لاعبة تركت بصمتها في العزيمة.','🫖 🎊')+`<section class="body"><div class="end-box"><div class="result-icon">${c.emoji}</div><span class="badge-score">نتيجة العزيمة</span><h2>${c.title}</h2><p>${c.text}</p><div>👑 نجمة اللمّة: <b>${escapeHtml(champions)}</b></div></div><h3>كيف طلعت عزيمتنا؟</h3>${statMarkup()}<h3>🏅 ترتيب اللاعبات</h3><div class="leaderboard">${sorted.map((p,i)=>`<div class="leader"><span><span class="medal">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'⭐'}</span>${escapeHtml(p.name)}</span><b>${p.score} نقطة</b></div>`).join('')}</div><div class="buttons"><button class="primary" id="replay">🔄 جلسة جديدة</button><button class="secondary" id="copyResult">📋 نسخ النتيجة</button></div><p class="fine">جرّبوا خيارات ثانية في الجولة الجاية: لها مواقف وتحديات ونهايات مختلفة.</p></section>`);
    $('replay').onclick=()=>{draftNames=game.players.map(x=>x.name);game=null;screen='setup';try{localStorage.removeItem(SAVE_KEY);}catch(_){}saved=null;render();};$('copyResult').onclick=copyResults;
  }
  async function copyResults(){const s=resultsText();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);toast('تم نسخ النتيجة 📋');return;}}catch(_){}
    const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();if(ok)toast('تم نسخ النتيجة 📋');else{window.prompt('انسخي النتيجة:',s);}}
  $('soundBtn').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem(SOUND_KEY,soundOn?'on':'off');}catch(_){}render();if(soundOn)beep('ok');};
  $('homeBtn').onclick=()=>{if(screen==='game'&&game&&game.mode!=='finale'){if(!confirm('تبغون ترجعون للبداية؟ الجولة محفوظة وتقدرون تكملونها.'))return;}screen='setup';render();};
  render();
  </script>
</body>
</html>
